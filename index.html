<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cove Gym &amp; Studio has moved to bnjc.co.uk/gym</title>
<!--
  Cove's website now lives on BNJC (13 Nov 2026): https://bnjc.co.uk/gym/
  Every page of this site is this same file (index.html, 404.html, privacy.html, thanks.html), so any old link,
  bookmark or search result lands on the matching page there. GitHub Pages cannot send a server redirect, so the
  forwarding is the script below, with a refresh tag for browsers without JavaScript and a canonical link that
  tells search engines where the page is now.
  Joining is Cove's ClubRight sign-up; tours and questions are the form on https://bnjc.co.uk/gym/#visit.
-->
<link rel="canonical" href="https://bnjc.co.uk/gym/">
<meta name="robots" content="noindex, follow">
<script>
(function () {
  var base = 'https://bnjc.co.uk';
  var path = window.location.pathname.replace(/\/+$/, '');
  var hash = window.location.hash.replace('#', '');
  var params = new URLSearchParams(window.location.search);
  var plans = { 'under25': 'Under 25s', 'gym': 'Gym Only', 'gym-classes': 'Gym & Classes', 'residents': 'Residents', 'shabbat': 'Shabbat-friendly' };
  var asks = { 'tour': 'Book a free tour', 'question': 'Ask a question' };
  var to;

  if (/privacy(\.html)?$/.test(path)) {
    to = base + '/privacy/';
  } else if (params.get('enquiry') === 'join') {
    to = 'https://cove.clubright.co.uk/register';
  } else if (asks[params.get('enquiry')]) {
    var q = new URLSearchParams({ cove_enquiry: asks[params.get('enquiry')] });
    if (plans[params.get('plan')]) { q.set('cove_plan', plans[params.get('plan')]); }
    to = base + '/gym/?' + q.toString() + '#visit';
  } else {
    var map = {
      'memberships': '/gym/#memberships',
      'how-it-works': '/gym/#how-it-works',
      'classes': '/gym/classes/',
      'visit': '/gym/#visit',
      'find-us': '/gym/#contact',
      'faq': '/gym/#questions'
    };
    to = base + (map[hash] || '/gym/');
  }
  window.location.replace(to);
})();
</script>
<meta http-equiv="refresh" content="0; url=https://bnjc.co.uk/gym/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F6F1E7; color: #2F4F4F;
         font: 18px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
  a { color: #1A756B; }
</style>
</head>
<body>
  <main>
    <p>Cove Gym &amp; Studio has moved.</p>
    <p><a href="https://bnjc.co.uk/gym/">Go to Cove at bnjc.co.uk/gym</a></p>
  </main>
</body>
</html>
