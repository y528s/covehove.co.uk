<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Cove Gym &amp; Studio, Hove</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#F6F1E7">
<link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap">
<!-- This page is served from any address on the site, so its styles are inlined
     rather than linked — a relative stylesheet path would break on deep URLs. -->
<style>
  :root {
    --navy:#112337; --cream:#F6F1E7; --teal:#1E9C92; --ink-muted:#6F5B42;
    --font-display:"Fraunces",Georgia,serif;
    --font-body:"Assistant",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    padding:2rem clamp(1.25rem,6vw,3rem);
    background:var(--cream); color:var(--navy);
    font-family:var(--font-body); font-size:1.0625rem; line-height:1.6;
  }
  main{max-width:34rem}
  .eyebrow{
    display:block; font-size:.8125rem; font-weight:600; letter-spacing:.28em;
    text-transform:uppercase; color:var(--ink-muted); margin-bottom:1.25rem;
  }
  .wordmark{
    font-family:var(--font-display); font-weight:300; font-size:1.85rem;
    letter-spacing:-.02em; color:var(--navy); text-decoration:none;
    display:inline-block; margin-bottom:2.5rem;
  }
  h1{
    font-family:var(--font-display); font-weight:300; font-size:clamp(2rem,1.2rem+3vw,3rem);
    line-height:1.08; letter-spacing:-.02em; margin:0 0 .5em;
  }
  p{margin:0 0 1.15em; color:rgba(17,35,55,.8)}
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    min-height:48px; padding:.75rem 1.6rem; border-radius:999px;
    background:var(--teal); color:var(--navy);
    font-weight:600; text-decoration:none; margin-top:1rem;
  }
  .btn:focus-visible{outline:2px solid var(--navy); outline-offset:2px}
  a:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
</style>
</head>
<body>
<main>
  <a class="wordmark" href="/">cove</a>
  <span class="eyebrow">404</span>
  <h1>That page has wandered off.</h1>
  <p>
    It happens. Everything about Cove — memberships, classes, opening hours and how to
    book a free tour — is on one page, so let’s put you back on it.
  </p>
  <a class="btn" href="/">Back to the site</a>
</main>
</body>
</html>
